name: Community release retry

on:
  push:
    tags:
      - 'community-release-v*'

permissions:
  contents: read

jobs:
  publish-release:
    name: Publish existing community artifacts
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Linux packages from the successful build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32591615335
          name: readest-community-linux-x64
          path: release-assets

      - name: Download pacman package from the successful build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32591615335
          name: readest-community-linux-pacman-x64
          path: release-assets

      - name: Download unsigned IPA from the successful build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32591615335
          name: readest-community-ios-unsigned
          path: release-assets

      - name: Upload assets to the existing community release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trigger_tag="$GITHUB_REF_NAME"
          target_version="${trigger_tag#community-release-v}"
          target_version="${target_version%-r*}"
          target_tag="community-v$target_version"

          mapfile -t assets < <(find release-assets -type f \( \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.pkg.tar.zst' -o \
            -name '*.ipa' \
          \) -print)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo 'No community release assets were downloaded.' >&2
            exit 1
          fi
          printf 'Uploading assets to %s:\n%s\n' "$target_tag" "${assets[@]}"
          gh release edit "$target_tag" --repo "$GITHUB_REPOSITORY" \
            --title "Readest Community $target_tag" \
            --notes "Community build artifacts for $target_tag. This is an unofficial community build."
          gh release upload "$target_tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
