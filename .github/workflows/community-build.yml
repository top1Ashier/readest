name: Community builds

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: Build Linux AppImage, DEB, and pacman packages
        type: boolean
        default: true
      build_ios:
        description: Build the unsigned iOS IPA
        type: boolean
        default: true
  push:
    tags:
      - 'community-v*'
      - 'community-ios-v*'

permissions:
  contents: read

concurrency:
  group: community-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Linux x64
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'community-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: community-linux-x64

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install project dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors

      - name: Build unsigned Linux packages
        working-directory: apps/readest-app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb --no-sign --ci

      - name: Upload Linux binary for pacman packaging
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-community-linux-binary
          path: target/x86_64-unknown-linux-gnu/release/readest
          if-no-files-found: error
          retention-days: 1

      - name: Upload Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-community-linux-x64
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  linux-pacman:
    name: Linux pacman package
    if: >-
      (github.event_name == 'push' && startsWith(github.ref_name, 'community-v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_linux)
    needs: linux-x64
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container: archlinux:base-devel
    steps:
      - name: Bootstrap Arch packaging tools
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: readest-community-linux-binary
          path: target/x86_64-unknown-linux-gnu/release

      - name: Build pacman package
        run: |
          chmod 755 target/x86_64-unknown-linux-gnu/release/readest
          useradd --create-home builder
          mkdir -p target/arch-package
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env PKGDEST="$GITHUB_WORKSPACE/target/arch-package" bash -lc "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --noconfirm --nodeps --force"

      - name: Upload pacman package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-community-linux-pacman-x64
          path: target/arch-package/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  ios-unsigned:
    name: iOS unsigned IPA
    if: >-
      (github.event_name == 'push' &&
        (startsWith(github.ref_name, 'community-v') || startsWith(github.ref_name, 'community-ios-v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_ios)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: community-ios-arm64

      - name: Install project dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @readest/readest-app setup-vendors

      - name: Build unsigned IPA
        working-directory: apps/readest-app
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
        run: bash scripts/build-ios-unsigned.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-community-ios-unsigned
          path: apps/readest-app/src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
          retention-days: 14
